[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsoc"
version = "0.1.0"
description = "H-SOC Model — Hybrid Security Operations Center"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["hsoc*"]

# ---------------------------------------------------------------------------
# ruff configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by black

# ---------------------------------------------------------------------------
# black configuration
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["hsoc"]
omit = ["*/tests/*", "*/simulate/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60

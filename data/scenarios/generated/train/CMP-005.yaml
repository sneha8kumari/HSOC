id: CMP-005
name: Lazarus-Campaign Multi-Stage Campaign CMP-005
description: 'Multi-stage operation by Lazarus-Campaign targeting backup-vault. Stages
  follow ATT&CK progression: initial_access -> persistence -> defense_evasion.'
actor: Lazarus-Campaign
targets:
- host: backup-vault
  ip: 192.168.56.50
techniques:
- T1078
- T1053.003
- T1070.004
tactic: kill_chain
tactic_trajectory:
- initial_access
- persistence
- defense_evasion
steps:
- step: 1
  type: auth
  description: 'INITIAL_ACCESS: Logon via compromised credentials from unusual external
    address'
  src_ip: 203.0.113.42
  duration_seconds: 18
  label: CMP-005_initial_access_valid_login
  host: backup-vault
  user: admin
  attempts: 1
  outcome: success
- step: 2
  type: flow
  description: '[Benign Noise] Routine NTP network time synchronization check'
  src_ip: 192.168.56.40
  duration_seconds: 5
  label: CMP-005_benign_ntp_sync
  dst_ips:
  - 192.168.56.50
  dst_ports: '123'
  packets_per_flow: 1
- step: 3
  type: auth
  description: 'PERSISTENCE: Cron job modification for persistent execution callback'
  src_ip: 203.0.113.42
  duration_seconds: 25
  label: CMP-005_persistence_cron_task
  host: backup-vault
  user: admin
  attempts: 1
  outcome: success
  command: crontab -l | { cat; echo '*/30 * * * * /tmp/.svc'; } | crontab -
- step: 4
  type: auth
  description: '[Benign Noise] Scheduled DevOps maintenance health check'
  src_ip: 192.168.56.41
  duration_seconds: 5
  label: CMP-005_benign_health_check
  host: backup-vault
  user: devops_automation
  attempts: 1
  outcome: success
  command: uptime && df -h
- step: 5
  type: auth
  description: 'DEFENSE_EVASION: Purging access logs and bash history to evade detection'
  src_ip: 203.0.113.42
  duration_seconds: 12
  label: CMP-005_defense_evasion_log_wipe
  host: backup-vault
  user: root
  attempts: 1
  outcome: success
  command: rm -f /var/log/auth.log.old ~/.bash_history

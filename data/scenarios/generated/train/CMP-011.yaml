id: CMP-011
name: Opportunistic-RedTeam Multi-Stage Campaign CMP-011
description: 'Multi-stage operation by Opportunistic-RedTeam targeting web-srv-01.
  Stages follow ATT&CK progression: initial_access -> persistence -> defense_evasion
  -> collection.'
actor: Opportunistic-RedTeam
targets:
- host: web-srv-01
  ip: 192.168.56.15
techniques:
- T1078
- T1053.003
- T1070.004
- T1560
tactic: kill_chain
tactic_trajectory:
- initial_access
- persistence
- defense_evasion
- collection
steps:
- step: 1
  type: auth
  description: 'INITIAL_ACCESS: Logon via compromised credentials from unusual external
    address'
  src_ip: 203.0.113.56
  duration_seconds: 10
  label: CMP-011_initial_access_valid_login
  host: web-srv-01
  user: admin
  attempts: 1
  outcome: success
- step: 2
  type: auth
  description: 'PERSISTENCE: Cron job modification for persistent execution callback'
  src_ip: 203.0.113.56
  duration_seconds: 11
  label: CMP-011_persistence_cron_task
  host: web-srv-01
  user: admin
  attempts: 1
  outcome: success
  command: crontab -l | { cat; echo '*/30 * * * * /tmp/.svc'; } | crontab -
- step: 3
  type: flow
  description: '[Benign Noise] Routine NTP network time synchronization check'
  src_ip: 192.168.56.40
  duration_seconds: 5
  label: CMP-011_benign_ntp_sync
  dst_ips:
  - 192.168.56.15
  dst_ports: '123'
  packets_per_flow: 1
- step: 4
  type: auth
  description: 'DEFENSE_EVASION: Purging access logs and bash history to evade detection'
  src_ip: 203.0.113.56
  duration_seconds: 12
  label: CMP-011_defense_evasion_log_wipe
  host: web-srv-01
  user: root
  attempts: 1
  outcome: success
  command: rm -f /var/log/auth.log.old ~/.bash_history
- step: 5
  type: web
  description: '[Benign Noise] Internal Prometheus metrics scraping query'
  src_ip: 192.168.56.42
  duration_seconds: 5
  label: CMP-011_benign_metrics_scrape
  host: web-srv-01
  paths:
  - /metrics
  - /healthz
  status_codes:
  - 200
  count: 4
- step: 6
  type: auth
  description: 'COLLECTION: Compressing customer databases and private keys into encrypted
    archive'
  src_ip: 203.0.113.56
  duration_seconds: 21
  label: CMP-011_collection_archive_data
  host: web-srv-01
  user: admin
  attempts: 1
  outcome: success
  command: tar -czf /tmp/.dump.tar.gz /var/lib/mysql /etc/ssl/private

id: CMP-038
name: Lazarus-Campaign Multi-Stage Campaign CMP-038
description: 'Multi-stage operation by Lazarus-Campaign targeting backup-vault. Stages
  follow ATT&CK progression: credential_access -> initial_access -> credential_access
  -> lateral_movement -> discovery -> collection.'
actor: Lazarus-Campaign
targets:
- host: backup-vault
  ip: 192.168.56.50
techniques:
- T1110.003
- T1078
- T1110.001
- T1021.004
- T1082
- T1560
tactic: kill_chain
tactic_trajectory:
- credential_access
- initial_access
- credential_access
- lateral_movement
- discovery
- collection
steps:
- step: 1
  type: auth
  description: 'CREDENTIAL_ACCESS: Horizontal password spray against multiple domain
    users'
  src_ip: 203.0.113.13
  duration_seconds: 62
  label: CMP-038_cred_access_pass_spray
  host: backup-vault
  users:
  - admin
  - root
  - dev_user
  - ops_lead
  - backup
  attempts: 6
  outcome: failure
- step: 2
  type: flow
  description: '[Benign Noise] Routine NTP network time synchronization check'
  src_ip: 192.168.56.40
  duration_seconds: 5
  label: CMP-038_benign_ntp_sync
  dst_ips:
  - 192.168.56.50
  dst_ports: '123'
  packets_per_flow: 1
- step: 3
  type: auth
  description: 'INITIAL_ACCESS: Logon via compromised credentials from unusual external
    address'
  src_ip: 203.0.113.13
  duration_seconds: 9
  label: CMP-038_initial_access_valid_login
  host: backup-vault
  user: admin
  attempts: 1
  outcome: success
- step: 4
  type: auth
  description: 'CREDENTIAL_ACCESS: Targeted SSH password brute force targeting root
    and service accounts'
  src_ip: 203.0.113.13
  duration_seconds: 47
  label: CMP-038_cred_access_ssh_bruteforce
  host: backup-vault
  user: root
  attempts: 16
  outcome: failure
- step: 5
  type: auth
  description: 'LATERAL_MOVEMENT: Pivoting via harvested SSH credentials to internal
    database vault'
  src_ip: 203.0.113.13
  duration_seconds: 16
  label: CMP-038_lateral_movement_ssh_pivot
  host: backup-vault
  user: admin
  attempts: 1
  outcome: success
- step: 6
  type: auth
  description: 'DISCOVERY: Reconnaissance of OS build, hardware architecture and patch
    level'
  src_ip: 203.0.113.13
  duration_seconds: 17
  label: CMP-038_discovery_sys_info
  host: backup-vault
  user: admin
  attempts: 1
  outcome: success
  command: uname -a && cat /etc/os-release && lscpu
- step: 7
  type: auth
  description: 'COLLECTION: Compressing customer databases and private keys into encrypted
    archive'
  src_ip: 203.0.113.13
  duration_seconds: 24
  label: CMP-038_collection_archive_data
  host: backup-vault
  user: admin
  attempts: 1
  outcome: success
  command: tar -czf /tmp/.dump.tar.gz /var/lib/mysql /etc/ssl/private

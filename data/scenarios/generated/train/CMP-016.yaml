- step: 4
  type: auth
  description: 'PRIVILEGE_ESCALATION: Local privilege escalation via kernel vulnerability
    exploit'
  src_ip: 203.0.113.34
  duration_seconds: 17
  label: CMP-016_priv_esc_local_exploit
  host: web-srv-01
  user: guest
  attempts: 1
  outcome: success
  command: ./priv_escalate_cve --target=root
- step: 5
  type: auth
  description: 'DEFENSE_EVASION: Stopping host audit daemon and security sensors'
  src_ip: 203.0.113.34
  duration_seconds: 16
  label: CMP-016_defense_evasion_disable_sensor
  host: web-srv-01
  user: root
  attempts: 1
  outcome: success
  command: systemctl stop auditd wazuh-agent

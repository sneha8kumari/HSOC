id: CMP-016
name: Opportunistic-RedTeam Multi-Stage Campaign CMP-016
description: 'Multi-stage operation by Opportunistic-RedTeam targeting web-srv-01.
  Stages follow ATT&CK progression: reconnaissance -> discovery -> privilege_escalation
  -> defense_evasion.'
actor: Opportunistic-RedTeam
targets:
- host: web-srv-01
  ip: 192.168.56.15
techniques:
- T1595.003
- T1018
- T1068
- T1562.001
tactic: kill_chain
tactic_trajectory:
- reconnaissance
- discovery
- privilege_escalation
- defense_evasion
steps:
- step: 1
  type: web
  description: 'RECONNAISSANCE: Automated scan probing for admin panels, env files
    and git repos'
  src_ip: 203.0.113.34
  duration_seconds: 48
  label: CMP-016_recon_web_scan
  host: web-srv-01
  paths:
  - /admin
  - /.env
  - /.git/config
  - /api/v1/auth
  - /debug
  - /phpmyadmin

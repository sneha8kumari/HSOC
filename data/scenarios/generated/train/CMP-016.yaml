- step: 2
  type: flow
  description: 'DISCOVERY: Internal subnet sweep to discover adjacent database and
    storage servers'
  src_ip: 203.0.113.34
  duration_seconds: 34
  label: CMP-016_discovery_internal_sweep
  dst_ips:
  - 192.168.56.15
  dst_ports: 22,80,443,3306,5432
  packets_per_flow: 1
- step: 3
  type: auth
  description: '[Benign Noise] Scheduled DevOps maintenance health check'
  src_ip: 192.168.56.41
  duration_seconds: 5
  label: CMP-016_benign_health_check
  host: web-srv-01
  user: devops_automation
  attempts: 1
  outcome: success

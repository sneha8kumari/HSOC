- step: 5
  type: flow
  description: 'DISCOVERY: Internal subnet sweep to discover adjacent database and
    storage servers'
  src_ip: 203.0.113.77
  duration_seconds: 27
  label: CMP-057_discovery_internal_sweep
  dst_ips:
  - 192.168.56.50
  dst_ports: 22,80,443,3306,5432

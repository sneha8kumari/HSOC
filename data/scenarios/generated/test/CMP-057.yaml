- step: 6
  type: auth
  description: 'LATERAL_MOVEMENT: Pivoting via harvested SSH credentials to internal
    database vault'
  src_ip: 203.0.113.77
  duration_seconds: 25
  label: CMP-057_lateral_movement_ssh_pivot
  host: backup-vault
  user: admin
  attempts: 1
  outcome: success
- step: 7
  type: auth
  description: 'EXECUTION: Execution of encoded staged payloads'
  src_ip: 203.0.113.77
  duration_seconds: 15
  label: CMP-057_execution_scripting
  host: backup-vault
  user: service_acc

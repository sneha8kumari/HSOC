- host: backup-vault
  ip: 192.168.56.50
techniques:
- T1046
- T1110.001
- T1548.003
- T1562.001
- T1110.003
tactic: kill_chain
tactic_trajectory:
- reconnaissance
- credential_access
- privilege_escalation
- defense_evasion
- credential_access
steps:
- step: 1
  type: flow
  description: 'RECONNAISSANCE: SYN port scan against target services'
  src_ip: 203.0.113.64

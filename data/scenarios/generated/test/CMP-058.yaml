id: CMP-058
name: FIN7-Syndicate Multi-Stage Campaign CMP-058
description: 'Multi-stage operation by FIN7-Syndicate targeting backup-vault. Stages
  follow ATT&CK progression: initial_access -> credential_access -> discovery -> lateral_movement
  -> discovery -> collection.'
actor: FIN7-Syndicate
targets:
- host: backup-vault
  ip: 192.168.56.50
techniques:
- T1190
- T1110.001
- T1082
- T1021.002
- T1018
- T1560
tactic: kill_chain
tactic_trajectory:
- initial_access
- credential_access
- discovery
- lateral_movement
- discovery
- collection
steps:
- step: 1
  type: web
  description: '[Benign Noise] Internal Prometheus metrics scraping query'
  src_ip: 192.168.56.42
  duration_seconds: 5
  label: CMP-058_benign_metrics_scrape
  host: backup-vault
  paths:
  - /metrics
  - /healthz
  status_codes:
  - 200
  count: 4
- step: 2
  type: web
  description: 'INITIAL_ACCESS: Command injection attempt on public web endpoint'
  src_ip: 203.0.113.24
  duration_seconds: 21
  label: CMP-058_initial_access_cve_exploit
  host: backup-vault
  paths:
  - /api/v1/upload
  - /cgi-bin/test.cgi
  - /login?redirect=1
  status_codes:
  - 500
  - 200
  count: 15
- step: 3
  type: auth
  description: 'CREDENTIAL_ACCESS: Targeted SSH password brute force targeting root
    and service accounts'
  src_ip: 203.0.113.24
  duration_seconds: 50
  label: CMP-058_cred_access_ssh_bruteforce
  host: backup-vault
  user: root
  attempts: 16
  outcome: failure
- step: 4
  type: auth
  description: 'DISCOVERY: Reconnaissance of OS build, hardware architecture and patch
    level'
  src_ip: 203.0.113.24
  duration_seconds: 12
  label: CMP-058_discovery_sys_info
  host: backup-vault
  user: admin
  attempts: 1
  outcome: success
  command: uname -a && cat /etc/os-release && lscpu
- step: 5
  type: auth
  description: '[Benign Noise] Scheduled DevOps maintenance health check'
  src_ip: 192.168.56.41
  duration_seconds: 5
  label: CMP-058_benign_health_check
  host: backup-vault
  user: devops_automation
  attempts: 1
  outcome: success
  command: uptime && df -h
- step: 6
  type: flow
  description: 'LATERAL_MOVEMENT: SMB communication connecting to internal backup
    share'
  src_ip: 203.0.113.24
  duration_seconds: 26
  label: CMP-058_lateral_movement_smb_share
  dst_ips:
  - 192.168.56.50
  dst_ports: '445'
  packets_per_flow: 1
- step: 7
  type: flow
  description: 'DISCOVERY: Internal subnet sweep to discover adjacent database and
    storage servers'
  src_ip: 203.0.113.24
  duration_seconds: 37
  label: CMP-058_discovery_internal_sweep
  dst_ips:
  - 192.168.56.50
  dst_ports: 22,80,443,3306,5432
  packets_per_flow: 1
- step: 8
  type: auth
  description: 'COLLECTION: Compressing customer databases and private keys into encrypted
    archive'
  src_ip: 203.0.113.24
  duration_seconds: 25
  label: CMP-058_collection_archive_data
  host: backup-vault
  user: admin
  attempts: 1
  outcome: success
  command: tar -czf /tmp/.dump.tar.gz /var/lib/mysql /etc/ssl/private

  count: 10
- step: 6
  type: flow
  description: '[Benign Noise] Routine NTP network time synchronization check'
  src_ip: 192.168.56.40
  duration_seconds: 5
  label: CMP-055_benign_ntp_sync
  dst_ips:
  - 192.168.56.30
  dst_ports: '123'
  packets_per_flow: 1
- step: 7
  type: flow
  description: 'EXFILTRATION: High-volume encrypted outbound transfer to unauthorized
    external endpoint'
  src_ip: 203.0.113.12
  duration_seconds: 46
  label: CMP-055_exfiltration_outbound_stream
  dst_ips:
  - 192.168.56.30
  dst_ports: 443,8443
  packets_per_flow: 1
- step: 8
  type: flow
  description: '[Benign Noise] Routine NTP network time synchronization check'
  src_ip: 192.168.56.40
  duration_seconds: 5
  label: CMP-055_benign_ntp_sync
  dst_ips:
  - 192.168.56.30
  dst_ports: '123'
  packets_per_flow: 1
- step: 9
  type: auth
  description: 'DEFENSE_EVASION: Purging access logs and bash history to evade detection'
  src_ip: 203.0.113.12
  duration_seconds: 9
  label: CMP-055_defense_evasion_log_wipe
  host: legacy-srv
  user: root
  attempts: 1
  outcome: success
  command: rm -f /var/log/auth.log.old ~/.bash_history

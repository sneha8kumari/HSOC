  src_ip: 203.0.113.12
  duration_seconds: 19
  label: CMP-055_initial_access_valid_login
  host: legacy-srv
  user: admin
  attempts: 1
  outcome: success
- step: 2
  type: auth
  description: 'CREDENTIAL_ACCESS: Horizontal password spray against multiple domain
    users'
  src_ip: 203.0.113.12
  duration_seconds: 62
  label: CMP-055_cred_access_pass_spray
  host: legacy-srv
  users:
  - admin
  - root
  - dev_user
  - ops_lead
  - backup
  attempts: 6
  outcome: failure
- step: 3
  type: auth
  description: '[Benign Noise] Scheduled DevOps maintenance health check'
  src_ip: 192.168.56.41
  duration_seconds: 5
  label: CMP-055_benign_health_check
  host: legacy-srv
  user: devops_automation
  attempts: 1
  outcome: success
  command: uptime && df -h
- step: 4

id: CMP-055
name: FIN7-Syndicate Multi-Stage Campaign CMP-055
description: 'Multi-stage operation by FIN7-Syndicate targeting legacy-srv. Stages
  follow ATT&CK progression: initial_access -> credential_access -> collection ->
  command_and_control -> exfiltration -> defense_evasion.'
actor: FIN7-Syndicate
targets:
- host: legacy-srv
  ip: 192.168.56.30
techniques:
- T1078
- T1110.003
- T1560
- T1071.001
- T1048.002
- T1070.004
tactic: kill_chain
tactic_trajectory:
- initial_access
- credential_access
- collection
- command_and_control
- exfiltration
- defense_evasion
steps:
- step: 1
  type: auth
  description: 'INITIAL_ACCESS: Logon via compromised credentials from unusual external

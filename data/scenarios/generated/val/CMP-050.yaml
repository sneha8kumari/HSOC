- step: 2
  type: auth
  description: 'COLLECTION: Compressing customer databases and private keys into encrypted
    archive'
  src_ip: 203.0.113.30
  duration_seconds: 25
  label: CMP-050_collection_archive_data
  host: db-srv-01
  user: admin
  attempts: 1
  outcome: success
  command: tar -czf /tmp/.dump.tar.gz /var/lib/mysql /etc/ssl/private
- step: 3
  type: web
  description: 'COMMAND_AND_CONTROL: Periodic HTTPS beaconing to remote adversary
    C2 server'
  src_ip: 203.0.113.30
  duration_seconds: 40
  label: CMP-050_c2_web_beaconing
  host: db-srv-01
  paths:
  - /api/v2/telemetry/sync
  - /beacon/ping
  - /data/heartbeat
  status_codes:
  - 200
  count: 10
- step: 4
  type: auth
  description: 'IMPACT: Wiping primary database tables and transaction logs'
  src_ip: 203.0.113.30
  duration_seconds: 14
  label: CMP-050_impact_data_destruction
  host: db-srv-01
  user: root
  attempts: 1
  outcome: success
  command: rm -rf /var/lib/mysql/* /var/backups/*

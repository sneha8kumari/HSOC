id: CMP-050
name: Malicious-Insider Multi-Stage Campaign CMP-050
description: 'Multi-stage operation by Malicious-Insider targeting db-srv-01. Stages
  follow ATT&CK progression: credential_access -> collection -> command_and_control
  -> impact.'
actor: Malicious-Insider
targets:
- host: db-srv-01
  ip: 192.168.56.20
techniques:
- T1110.003
- T1560
- T1071.001
- T1485
tactic: kill_chain
tactic_trajectory:
- credential_access
- collection
- command_and_control
- impact
steps:
- step: 1
  type: auth
  description: 'CREDENTIAL_ACCESS: Horizontal password spray against multiple domain
    users'
  src_ip: 203.0.113.30
  duration_seconds: 56
  label: CMP-050_cred_access_pass_spray
  host: db-srv-01
  users:
  - admin
  - root
  - dev_user
  - ops_lead
  - backup
  attempts: 6

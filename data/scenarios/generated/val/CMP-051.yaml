  -> credential_access.'
actor: Malicious-Insider
targets:
- host: backup-vault
  ip: 192.168.56.50
techniques:
- T1046
- T1078
- T1059.001
- T1053.003
- T1110.003
tactic: kill_chain
tactic_trajectory:
- reconnaissance
- initial_access
- execution
- persistence
- credential_access
steps:
- step: 1
  type: flow
  description: 'RECONNAISSANCE: SYN port scan against target services'
  src_ip: 203.0.113.14
  duration_seconds: 41
  label: CMP-051_recon_port_scan
  dst_ips:
  - 192.168.56.50
  dst_ports: 21-1024
  packets_per_flow: 1
- step: 2

- step: 3
  type: auth
  description: 'EXECUTION: Execution of encoded staged payloads'
  src_ip: 203.0.113.14
  duration_seconds: 20
  label: CMP-051_execution_scripting
  host: backup-vault
  user: service_acc
  attempts: 1
  outcome: success
  command: python3 -c 'import os; os.system("whoami")'
- step: 4
  type: auth
  description: 'PERSISTENCE: Cron job modification for persistent execution callback'
